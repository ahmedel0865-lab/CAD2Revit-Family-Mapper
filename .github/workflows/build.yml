name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        run: echo "version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' addin/Directory.Build.props)" >> "$GITHUB_OUTPUT"

      - name: Revit add-in - test, build 2022-2026, package
        working-directory: addin
        run: bash tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SmartHostMEP-${{ steps.version.outputs.version }}
          path: addin/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SmartHostMEP-${{ needs.build.outputs.version }}
      - uses: softprops/action-gh-release@v2
        with:
          name: SmartHostMEP-${{ needs.build.outputs.version }}
          files: "*.zip"
